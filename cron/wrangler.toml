name = "olivers-score-cron"
main = "worker.js"
compatibility_date = "2024-09-01"
workers_dev = false

# Alle 30 Minuten (:29 und :59); nachts filtert der Worker (vor 06:29 Berliner Zeit kein Lauf).
# Ein einziger Cron-Ausdruck = ein Trigger (Free-Plan: max. 5 pro Konto).
[triggers]
crons = ["29,59 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "score"
database_id = "0156d61a-6bf5-40de-b0ab-82e60868f886"

[vars]
SYNC_URL = "https://olivers-score.pages.dev/api/sync"

# Secret (identisch mit CRON_SECRET im Pages-Projekt olivers-score):
#   npx wrangler secret put CRON_SECRET --config cron/wrangler.toml

[observability]
enabled = true
